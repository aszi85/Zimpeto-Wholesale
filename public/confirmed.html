<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Confirmado | Zimpeto Wholesale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-[#f2f2f2] text-gray-800 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white border-t-4 border-[#004d40] p-8 rounded-lg shadow-md text-center">
    
    <!-- Header/Logo -->
    <div class="text-[10px] font-black uppercase tracking-[0.2em] text-[#ff9800] mb-4">Zimpeto Wholesale</div>
    
    <!-- Success checkmark icon -->
    <div class="flex justify-center mb-6">
      <div class="h-16 w-16 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 text-3xl font-bold">
        ✓
      </div>
    </div>
    
    <h2 class="text-2xl font-black uppercase italic text-[#004d40] tracking-tight mb-2">Pagamento Confirmado!</h2>
    <p class="text-sm text-gray-500 mb-6">O seu pagamento via M-Pesa foi recebido com sucesso. A sua encomenda já está a ser processada.</p>
    
    <!-- Details Panel -->
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-5 text-left text-xs space-y-3 mb-8">
      <div class="flex justify-between border-b border-gray-150 pb-2">
        <span class="text-gray-500 font-bold uppercase tracking-wider">ID de Transacção:</span>
        <span id="displayTxId" class="font-black text-gray-800">...</span>
      </div>
      <div class="flex justify-between border-b border-gray-150 pb-2">
        <span class="text-gray-500 font-bold uppercase tracking-wider">Valor Pago:</span>
        <span id="displayAmount" class="font-black text-gray-800">... MT</span>
      </div>
      <div class="flex justify-between">
        <span class="text-gray-500 font-bold uppercase tracking-wider">Telemóvel M-Pesa:</span>
        <span id="displayPhone" class="font-black text-gray-800">...</span>
      </div>
    </div>

    <!-- Actions -->
    <div>
      <a href="/" class="block w-full bg-black hover:bg-black/80 text-white font-black uppercase text-[11px] py-4 rounded transition-colors text-center">
        Voltar à Página Principal
      </a>
    </div>

  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const transactionId = urlParams.get('transactionId');
    const amount = urlParams.get('amount');
    const phone = urlParams.get('phone');

    // Render details
    document.getElementById('displayTxId').textContent = transactionId || 'N/A';
    
    if (amount) {
      // Format number to local format
      const formattedAmount = parseFloat(amount).toLocaleString('pt-MZ');
      document.getElementById('displayAmount').textContent = `${formattedAmount} MT`;
    } else {
      document.getElementById('displayAmount').textContent = 'N/A';
    }

    document.getElementById('displayPhone').textContent = phone || 'N/A';
  </script>
</body>
</html>
